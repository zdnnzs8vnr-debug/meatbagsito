<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meatbag — lost?</title>
<meta name="theme-color" content="#05060a">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#05060a;color:#e8ecf1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
  .aura{position:fixed;inset:-30%;background:radial-gradient(40% 40% at 30% 30%,rgba(80,255,160,.18),transparent 60%),radial-gradient(40% 40% at 70% 70%,rgba(120,140,255,.16),transparent 60%);filter:blur(60px);animation:drift 18s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate3d(4%,-3%,0) scale(1.1)}}
  .wrap{position:relative;z-index:2;padding:24px}
  h1{font-size:clamp(56px,18vw,140px);line-height:.9;letter-spacing:-.04em;font-weight:800;background:linear-gradient(180deg,#fff,#7d8794);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin-top:18px;color:#8b95a3;font-size:15px;letter-spacing:.02em}
  a{display:inline-block;margin-top:28px;padding:14px 26px;border-radius:999px;background:#fff;color:#05060a;text-decoration:none;font-weight:600;font-size:14px;transition:.2s}
  a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="aura"></div>
  <div class="wrap">
    <h1>404</h1>
    <p>this page is meat. the real one is one tap away.</p>
    <a href="/">← back to meatbag.best</a>
  </div>
</body>
</html>
